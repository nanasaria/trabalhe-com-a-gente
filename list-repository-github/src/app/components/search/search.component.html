<div class="container-input">
    <input
        type="text"
        name="repository"
        class="input-repository"
        id="repository"
        [ngClass]="{
            'input-repository-lg': size === 'lg',
            'input-repository-md': size === 'md',
            'error-input': !hasParameter
        }"
        [(ngModel)]="repository"
        (keydown.enter)="searchRepository()"
        [placeholder]="placeholderText"
    />
    <i class="ph ph-magnifying-glass"></i>
</div>
